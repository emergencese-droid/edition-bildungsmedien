<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>AuroraView – Wildfire Monitoring</title>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: #eee;
        }
        #map {
            width: 100%;
            height: 80vh;
        }
        #timeline-controls {
            padding: 20px;
            text-align: center;
        }
        #timeline-controls button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h2 style="text-align:center;">AuroraView – Wildfire Monitoring</h2>

<div id="map"></div>

<div id="timeline-controls">
    <button id="playTimeline">▶ Play</button>
    <button id="pauseTimeline">⏸ Pause</button>
</div>

<script>

/* -----------------------------------------------------------
   AURORAVIEW – MAP INITIALIZATION
----------------------------------------------------------- */

function renderAuroraView(repo) {

    // Karte erstellen
    const map = L.map("map").setView([40.4168, -3.7038], 7);
    window._auroraMap = map;

    // Basiskarte
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19
    }).addTo(map);

    /* -----------------------------------------------------------
       EVENTS RENDERING
    ----------------------------------------------------------- */
    if (repo.events && repo.events.length > 0) {
        repo.events.forEach(ev => {
            if (ev.location) {
                L.circleMarker(ev.location, {
                    radius: 8,
                    color: "red",
                    fillColor: "orange",
                    fillOpacity: 0.8
                })
                .addTo(map)
                .bindPopup(`<b>Event:</b> ${ev.event_id}<br>${ev.description}`);
            }
        });
    }

    /* -----------------------------------------------------------
       INFRASTRUCTURE RENDERING
    ----------------------------------------------------------- */
    if (repo.infrastructure && repo.infrastructure.length > 0) {
        repo.infrastructure.forEach(obj => {
            if (obj.location) {
                L.marker(obj.location)
                .addTo(map)
                .bindPopup(`<b>${obj.type}</b><br>${obj.name}`);
            }
        });
    }

    /* -----------------------------------------------------------
       FIREFRONT STATIC RENDERING (first frame)
    ----------------------------------------------------------- */
    if (repo.firefronts && repo.firefronts.length > 0) {
        const ff = repo.firefronts[0];
        if (ff.polygon) {
            L.polygon(ff.polygon, {
                color: "yellow",
                weight: 3,
                opacity: 0.6
            })
            .addTo(map)
            .bindPopup(`<b>FireFront:</b> ${ff.firefront_id}`);
        }
    }

    /* -----------------------------------------------------------
       TIMELINE BUTTONS CONNECT
    ----------------------------------------------------------- */
    document.getElementById("playTimeline").onclick = playTimeline;
    document.getElementById("pauseTimeline").onclick = pauseTimeline;
}


/* -----------------------------------------------------------
   LOAD REPOSITORY
----------------------------------------------------------- */

function loadAuroraViewRepository() {
    fetch("/repository")
        .then(r => r.json())
        .then(repo => {
            renderAuroraView(repo);
            initTimeline(repo);   // Timeline aktivieren
        });
}


/* -----------------------------------------------------------
   TIMELINE ENGINE – AuroraView Playback
----------------------------------------------------------- */

// Globale Variablen
let timelineIndex = 0;
let timelineRunning = false;
let timelineInterval = null;

// FireFront-Daten zwischenspeichern
let firefrontData = [];

// Wird nach dem Laden des Repositories aufgerufen
function initTimeline(data) {
    firefrontData = data.firefronts || [];
    console.log("Timeline initialisiert mit", firefrontData.length, "FireFront-Stufen");
}


// Timeline starten
function playTimeline() {
    if (timelineRunning) return;

    console.log("Timeline gestartet");
    timelineRunning = true;

    timelineInterval = setInterval(() => {
        if (!timelineRunning) return;

        if (timelineIndex >= firefrontData.length) {
            console.log("Timeline beendet");
            pauseTimeline();
            return;
        }

        const ff = firefrontData[timelineIndex];

        // FireFront zeichnen
        if (ff.polygon) {
            L.polygon(ff.polygon, {
                color: "yellow",
                weight: 4,
                opacity: 0.8
            })
            .addTo(window._auroraMap)
            .bindPopup(`<b>FireFront Stufe:</b> ${ff.firefront_id}`);
        }

        timelineIndex++;
    }, 1200); // 1.2 Sekunden pro Frame
}


// Timeline pausieren
function pauseTimeline() {
    console.log("Timeline pausiert");
    timelineRunning = false;
    clearInterval(timelineInterval);
    timelineInterval = null;
}


// Buttons verbinden
document.getElementById("playTimeline").onclick = () => playTimeline();
document.getElementById("pauseTimeline").onclick = () => pauseTimeline();


/* -----------------------------------------------------------
   START
----------------------------------------------------------- */

loadAuroraViewRepository();

</script>

</body>
</html>
