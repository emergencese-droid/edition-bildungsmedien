.logo {
    width: 160px;
    height: auto;
    display: block;
    margin: 0 auto;
    filter: drop-shadow(0 0 6px #00aaff);
}

.main-nav ul {
    list-style: none;
    padding: 0;
    margin: 10px 0 0 0;
    text-align: center;
}

.main-nav ul li {
    display: inline-block;
    margin: 0 12px;
}

.main-nav ul li a {
    color: #ccc;
    text-decoration: none;
    font-weight: 500;
    transition: color 0.3s ease;
}

.main-nav ul li a:hover,
.main-nav ul li a.active {
    color: #00aaff;
}

